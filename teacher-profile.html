<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teacher Profile â€” SFRS</title>
  <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap");
    :root{--primary:#0c2a42;--accent:#c9462c;--accent-hover:#a53d21;--bg:#f2efe6;--surface:#fff;--border:#e5dece;--border-light:#f0eadb;--text:#16232c;--muted:#6b6255;--muted-light:#a89b86;--success:#0f8b5f;--nav-h:68px}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Inter",system-ui,sans-serif;color:var(--text);background:var(--bg);line-height:1.6;padding-top:var(--nav-h)}
    a{color:inherit;text-decoration:none}
    .nav{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);height:var(--nav-h);display:flex;align-items:center;padding:0 1.5rem}
    .nav-inner{max-width:1200px;margin:0 auto;width:100%;display:flex;align-items:center;justify-content:space-between}
    .nav-brand{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:1.1rem;color:var(--primary)}
    .nav-brand img{height:34px;width:auto}
    .nav-links{display:flex;align-items:center;gap:.25rem}
    .nav-link{padding:.45rem .85rem;border-radius:8px;font-size:.88rem;font-weight:500;color:var(--muted);transition:.15s}
    .nav-link:hover{color:var(--accent);background:#faf5ed}
    .container{max-width:1000px;margin:0 auto;padding:2rem 1.5rem}
    .back-link{display:inline-flex;align-items:center;gap:.35rem;font-size:.85rem;color:var(--muted);margin-bottom:1.5rem;font-weight:500}
    .back-link:hover{color:var(--accent)}
    .profile-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1.5rem;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2rem;margin-bottom:1.5rem}
    .profile-info{display:flex;align-items:center;gap:1.25rem}
    .avatar-big{width:72px;height:72px;border-radius:18px;background:linear-gradient(135deg,#0c2a42,#163a56);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:1.6rem}
    .profile-name{font-weight:700;font-size:1.3rem;color:var(--primary);margin-bottom:.15rem}
    .profile-designation{font-size:.9rem;color:var(--muted)}
    .profile-chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.4rem}
    .chip{font-size:.75rem;padding:.25rem .65rem;background:#faf7f0;border:1px solid var(--border);border-radius:100px;color:var(--muted)}
    .profile-scores{display:flex;gap:2.5rem}
    .score-item{text-align:center}.score-val{font-size:2rem;font-weight:800;color:var(--primary)}
    .score-lbl{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
    .section{background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-bottom:1.25rem}
    .section-header{padding:1.25rem 1.5rem;border-bottom:1px solid var(--border-light);display:flex;gap:.15rem;flex-direction:column}
    .section-kicker{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
    .section-title{font-size:1.05rem;font-weight:700;color:var(--primary)}
    .section-body{padding:1.5rem}
    .rating-bar{margin-bottom:.6rem}.rating-bar-label{display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:.2rem}
    .rating-bar-track{height:8px;background:var(--border);border-radius:4px;overflow:hidden}.rating-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#10b981,#0f8b5f)}
    .detail-list{display:flex;flex-direction:column;gap:.6rem;font-size:.88rem}.detail-list dt{font-weight:600;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}.detail-list dd{color:var(--text);margin:0}
    .comment-card{background:#faf7f0;border:1px solid var(--border);border-radius:12px;padding:1rem;margin-bottom:.75rem}
    .comment-card-meta{font-size:.75rem;color:var(--muted-light);margin-bottom:.3rem}
    .comment-card-text{font-size:.88rem;color:var(--text);line-height:1.6}
    .footer{text-align:center;padding:1rem;border-top:1px solid var(--border);font-size:.8rem;color:var(--muted-light)}
    .alert{padding:.75rem 1rem;border-radius:10px;font-size:.85rem;margin-bottom:1rem;font-weight:500}
    .alert-error{background:#fef2f2;color:var(--danger);border:1px solid #fecaca}
    @media(max-width:768px){.profile-header{flex-direction:column}.profile-scores{width:100%;justify-content:space-around}}
  </style>
</head>
<body>
<nav class="nav"><div class="nav-inner"><a class="nav-brand" href="/"><img src="assets/images/sfrs.png" alt="SFRS">SFRS</a><div class="nav-links"><a class="nav-link" href="/">Home</a><a class="nav-link" href="teacher-dashboard.html">My Dashboard</a><a class="nav-link" href="#" id="logoutLink">Logout</a></div></div></nav>

<div class="container">
  <a class="back-link" href="javascript:history.back()">â† Back</a>
  <div class="alert alert-error" id="alertBox" style="display:none"></div>

  <div class="profile-header">
    <div class="profile-info"><div class="avatar-big" id="avatarBig">T</div><div><div class="profile-name" id="profileName">Loadingâ€¦</div><div class="profile-designation"><span id="profileDesig">â€”</span> Â· <span id="profileDept">â€”</span></div><div class="profile-chips"><span class="chip" id="chipCode">â€”</span><span class="chip" id="chipStatus">â€”</span></div></div></div>
    <div class="profile-scores"><div class="score-item"><div class="score-val" id="scoreAvg">0.00</div><div class="score-lbl">Avg Rating</div></div><div class="score-item"><div class="score-val" id="scoreTotal">0</div><div class="score-lbl">Reviews</div></div></div>
  </div>

  <div class="section"><div class="section-header"><div class="section-kicker">About</div><div class="section-title">Profile Details</div></div><div class="section-body"><p style="color:var(--muted);font-size:.9rem;margin-bottom:1rem" id="profileBio">â€”</p><dl class="detail-list"><dt>Email</dt><dd id="detEmail">â€”</dd><dt>Phone</dt><dd id="detPhone">â€”</dd><dt>Office</dt><dd id="detOffice">â€”</dd></dl></div></div>

  <div class="section"><div class="section-header"><div class="section-kicker">Ratings</div><div class="section-title">Category Breakdown</div></div><div class="section-body" id="ratingBreakdown"></div></div>

  <div class="section"><div class="section-header"><div class="section-kicker">Comments</div><div class="section-title">Recent Comments</div></div><div class="section-body" id="commentList"></div></div>
</div>
<div class="footer">&copy; 2026 SFRS â€” Teacher Profile</div>

<script src="assets/js/supabase-client.min.js"></script>
<script>
  const sup=window.supabase.createClient("https://mstotzwqfbcvpcdgrnxy.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1zdG90endxZmJjdnBjZGdybnh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY0ODEzNTAsImV4cCI6MjA4MjA1NzM1MH0.JbIf3inEy0Ks5JPVGQfFycBXenIGDGtqUBjYB1JeAcw");
  const CAT=[{k:"teaching_quality",l:"Teaching Quality"},{k:"communication",l:"Communication"},{k:"course_organization",l:"Course Organization"},{k:"supportiveness",l:"Helpfulness/Supportiveness"},{k:"punctuality",l:"Punctuality"},{k:"overall_satisfaction",l:"Overall Satisfaction"}];
  const params=new URLSearchParams(window.location.search);
  let tdirId=null;

  (async function init(){
    const{data:{session}}=await sup.auth.getSession();if(!session){location.href="teacher-login.html";return}
    const{data:p}=await sup.from("profiles").select("*").eq("id",session.user.id).maybeSingle();
    if(!p||(p.role!=="teacher"&&p.role!=="admin")){await sup.auth.signOut();location.href="teacher-login.html";return}
    // Use teacher_directory_id from profile or URL param
    tdirId=params.get("id")||p.teacher_directory_id;
    if(!tdirId){document.getElementById("alertBox").style.display="block";document.getElementById("alertBox").textContent="No teacher profile specified.";return}
    const{data:td}=await sup.from("teachers_directory").select("*").eq("id",tdirId).maybeSingle();
    if(!td){document.getElementById("alertBox").style.display="block";document.getElementById("alertBox").textContent="Teacher not found.";return}
    document.getElementById("profileName").textContent=td.name||"â€”";
    document.getElementById("profileDesig").textContent=td.designation||"â€”";
    document.getElementById("profileDept").textContent=td.department||"â€”";
    document.getElementById("chipCode").textContent=td.short_code||"â€”";
    document.getElementById("chipStatus").textContent=td.status||"active";
    document.getElementById("profileBio").textContent=td.bio||"No bio available.";
    document.getElementById("detEmail").textContent=td.is_email_public?td.email||"â€”":"Not public";
    document.getElementById("detPhone").textContent=td.phone||"â€”";
    document.getElementById("detOffice").textContent=td.office_room||"â€”";
    if(td.name)document.getElementById("avatarBig").textContent=td.name.charAt(0).toUpperCase();

    const{data:fb}=await sup.from("feedbacks").select("*").eq("teacher_directory_id",tdirId).neq("status","hidden").order("submitted_at",{ascending:false});
    const vis=(fb||[]).filter(f=>f.status!=="hidden");
    const avg=vis.length?vis.reduce((s,f)=>s+(f.responses?.overall_satisfaction||0),0)/vis.length:0;
    document.getElementById("scoreAvg").textContent=avg.toFixed(2);
    document.getElementById("scoreTotal").textContent=vis.length;

    let rb="";
    CAT.forEach(c=>{const vals=vis.map(f=>f.responses?.[c.k]||0).filter(v=>v>0);const ca=vals.length?vals.reduce((s,v)=>s+v,0)/vals.length:0;rb+=`<div class="rating-bar"><div class="rating-bar-label"><span>${c.l}</span><span>${ca.toFixed(2)}/5</span></div><div class="rating-bar-track"><div class="rating-bar-fill" style="width:${(ca/5)*100}%"></div></div></div>`});
    document.getElementById("ratingBreakdown").innerHTML=rb||"<p style='color:var(--muted)'>No ratings yet.</p>";

    const comments=vis.filter(f=>f.comment).slice(0,5);
    document.getElementById("commentList").innerHTML=comments.length?comments.map(f=>`<div class="comment-card"><div class="comment-card-meta">${f.course_code||""} Â· ${f.semester||""}/${f.section||""} Â· ${f.submitted_at?new Date(f.submitted_at).toLocaleDateString():"â€”"}</div><div class="comment-card-text">"${f.comment}"</div></div>`).join(""):"<p style='color:var(--muted)'>No comments yet.</p>";
  })();

  document.getElementById("logoutLink").addEventListener("click",async()=>{await sup.auth.signOut();location.href="/"});
</script>
</body>
</html>
