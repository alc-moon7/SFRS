<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SFRS Login Test</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:440px;margin:60px auto;padding:20px;background:#f7f4ee}
    h2{color:#0c2a42}
    input,button{display:block;width:100%;padding:14px;margin:10px 0;font-size:16px;box-sizing:border-box;border:2px solid #e5dece;border-radius:10px;font-family:inherit}
    input:focus{outline:none;border-color:#c9462c}
    button{background:#c9462c;color:#fff;border:none;cursor:pointer;font-weight:700;font-size:17px}
    button:hover{background:#a53d21}
    button.green{background:#0f8b5f}
    button.green:hover{background:#0a6b47}
    #result{padding:18px;margin-top:15px;border-radius:10px;font-size:15px;line-height:1.5;white-space:pre-wrap;min-height:30px}
    .ok{background:#d1fae5;color:#047857;border:1px solid #a7f3d0}
    .err{background:#fee2e2;color:#b91c1c;border:1px solid #fecaca}
    .info{background:#e0f2fe;color:#0369a1;border:1px solid #bae6fd}
    hr{margin:20px 0;border-color:#e5dece}
  </style>
</head>
<body>
  <h2>🔧 SFRS Login Diagnostic</h2>
  <p style="color:#6b6255;font-size:14px">No external CDN needed — uses plain fetch().</p>

  <input type="email" id="email" placeholder="Email" value="zerosmoon.ff@gmail.com" autocomplete="email">
  <input type="password" id="password" placeholder="Password" value="sfrs2026" autocomplete="current-password">

  <button onclick="testLogin()" class="green">Test Login (Fetch API)</button>
  <button onclick="quickTest()">Quick Test (Network Check)</button>

  <hr>
  <div id="result"></div>

  <script>
    const SUPABASE_URL = "https://mstotzwqfbcvpcdgrnxy.supabase.co";
    const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1zdG90endxZmJjdnBjZGdybnh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY0ODEzNTAsImV4cCI6MjA4MjA1NzM1MH0.JbIf3inEy0Ks5JPVGQfFycBXenIGDGtqUBjYB1JeAcw";

    var resultEl = document.getElementById("result");

    function show(msg, cls) {
      resultEl.textContent = msg;
      resultEl.className = cls || "info";
    }

    // Quick network test — checks if Supabase is reachable
    async function quickTest() {
      show("Testing network connectivity to Supabase...", "info");
      try {
        var t0 = Date.now();
        var resp = await fetch(SUPABASE_URL + "/auth/v1/health", {
          method: "HEAD",
          headers: { "apikey": ANON_KEY }
        });
        var ms = Date.now() - t0;
        if (resp.ok) {
          show("✅ Network OK! Supabase reachable in " + ms + "ms.\nStatus: " + resp.status + "\n\nNow try the green Test Login button.", "ok");
        } else {
          show("⚠️ Network reachable but got status: " + resp.status, "err");
        }
      } catch(e) {
        show("❌ NETWORK ERROR: " + e.message + "\n\nSupabase is NOT reachable from your browser!", "err");
      }
    }

    // The actual login test
    async function testLogin() {
      var email = document.getElementById("email").value.trim();
      var password = document.getElementById("password").value;

      if (!email || !password) {
        show("Please enter both email and password.", "err");
        return;
      }

      show("🔄 Sending login request to Supabase...\n\nEmail: " + email + "\nPassword length: " + password.length, "info");

      try {
        var resp = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": ANON_KEY
          },
          body: JSON.stringify({ email: email, password: password })
        });

        var data = await resp.json();

        if (data.access_token) {
          show("✅✅✅ LOGIN SUCCESSFUL! ✅✅✅\n\nUser: " + data.user.email + "\nUser ID: " + data.user.id + "\n\nLogin works! The problem is in the regular login page — NOT your credentials.", "ok");
        } else if (data.error_code === "invalid_credentials" || data.msg === "Invalid login credentials") {
          show("❌ INVALID CREDENTIALS\n\nEmail: " + email + "\nAPI says the password is wrong.\nPossible causes:\n- Password was changed\n- Account doesn't exist\n- Password was never set for this user", "err");
        } else {
          show("⚠️ UNEXPECTED RESPONSE\n\n" + JSON.stringify(data, null, 2), "err");
        }
      } catch(e) {
        show("❌ FETCH ERROR: " + e.message + "\n\nPossible causes:\n- Network issue\n- CORS blocked (check Brave Shields)\n- Supabase project down", "err");
      }
    }

    // Auto-run quick test
    setTimeout(quickTest, 500);
  </script>
</body>
</html>
