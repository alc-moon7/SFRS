<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Test</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:400px;margin:80px auto;padding:20px}
    input,button{display:block;width:100%;padding:12px;margin:10px 0;font-size:16px;box-sizing:border-box}
    button{background:#c9462c;color:#fff;border:none;cursor:pointer;font-weight:700}
    #result{padding:15px;margin-top:15px;border-radius:8px;font-size:14px}
    .ok{background:#d1fae5;color:#047857}.err{background:#fee2e2;color:#b91c1c}
  </style>
</head>
<body>
  <h2>Login Test (Diagnostic)</h2>
  <p>This bypasses the main login page to test Supabase auth directly.</p>
  <input type="email" id="email" placeholder="Email" value="zerosmoon.ff@gmail.com">
  <input type="password" id="password" placeholder="Password" value="sfrs2026">
  <button id="loginBtn">Login</button>
  <button id="loginBtn2" style="background:#0c2a42;margin-top:-5px">Login (alt method)</button>
  <div id="result"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabase = window.supabase.createClient(
      "https://mstotzwqfbcvpcdgrnxy.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1zdG90endxZmJjdnBjZGdybnh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY0ODEzNTAsImV4cCI6MjA4MjA1NzM1MH0.JbIf3inEy0Ks5JPVGQfFycBXenIGDGtqUBjYB1JeAcw"
    );

    const resultEl = document.getElementById("result");

    function show(msg, isError) {
      resultEl.textContent = msg;
      resultEl.className = isError ? "err" : "ok";
    }

    document.getElementById("loginBtn").addEventListener("click", async function() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      show("Attempting login...", false);
      try {
        const result = await supabase.auth.signInWithPassword({ email, password });
        if (result.error) {
          show("FAILED: " + result.error.message, true);
        } else if (result.data?.session) {
          show("SUCCESS! Logged in as: " + result.data.user.email + " | Role check next...", false);
          // Check role
          const { data: profile } = await supabase.from("profiles").select("role").eq("id", result.data.user.id).maybeSingle();
          if (profile) {
            show("SUCCESS! Logged in as: " + result.data.user.email + " | Role: " + profile.role + " | Redirecting...", false);
            setTimeout(() => {
              location.href = profile.role === "teacher" ? "teacher-dashboard.html" : "student-dashboard.html";
            }, 1500);
          } else {
            show("SUCCESS! Logged in but no profile found.", true);
          }
        } else {
          show("UNEXPECTED: No session returned", true);
        }
      } catch (err) {
        show("EXCEPTION: " + (err.message || String(err)), true);
      }
    });

    // Alt method using fetch directly
    document.getElementById("loginBtn2").addEventListener("click", async function() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      show("Attempting login via fetch...", false);
      try {
        const resp = await fetch("https://mstotzwqfbcvpcdgrnxy.supabase.co/auth/v1/token?grant_type=password", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1zdG90endxZmJjdnBjZGdybnh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY0ODEzNTAsImV4cCI6MjA4MjA1NzM1MH0.JbIf3inEy0Ks5JPVGQfFycBXenIGDGtqUBjYB1JeAcw"
          },
          body: JSON.stringify({ email, password })
        });

        const data = await resp.json();
        if (data.access_token) {
          show("FETCH SUCCESS! Token obtained. Setting session...", false);
          await supabase.auth.setSession({
            access_token: data.access_token,
            refresh_token: data.refresh_token
          });
          show("FETCH SUCCESS! Session set. Redirecting...", false);
          setTimeout(() => location.href = "student-dashboard.html", 1000);
        } else {
          show("FETCH FAILED: " + (data.msg || data.error_description || JSON.stringify(data)), true);
        }
      } catch (err) {
        show("FETCH ERROR: " + (err.message || String(err)), true);
      }
    });
  </script>
</body>
</html>
