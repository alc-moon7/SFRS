<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login — SFRS</title>
  <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap");
    :root{--primary:#0c2a42;--accent:#c9462c;--accent-hover:#a53d21;--bg:#f7f4ee;--surface:#fff;--border:#e5dece;--text:#16232c;--muted:#6b6255;--danger:#d92d20}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Inter",system-ui,sans-serif;color:var(--text);background:linear-gradient(170deg,#f0ece4,#e8dfcc 60%,#ddd4bc);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem}
    .wrapper{width:100%;max-width:440px}
    .header{text-align:center;margin-bottom:2rem}.header img{height:44px;width:auto;margin-bottom:.75rem}
    .badge{display:inline-flex;align-items:center;gap:.4rem;background:#fee2e2;color:#b91c1c;font-size:.78rem;font-weight:700;padding:.3rem .9rem;border-radius:100px;margin-bottom:.75rem}
    .header h1{font-size:1.4rem;font-weight:700;color:var(--primary)}.header p{font-size:.88rem;color:var(--muted);margin-top:.25rem}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:2.5rem 2rem;box-shadow:0 20px 50px rgba(12,42,66,.1)}
    .form-group{margin-bottom:1.25rem}.form-label{display:block;font-size:.85rem;font-weight:600;color:var(--text);margin-bottom:.35rem}
    .form-input{width:100%;padding:.85rem 1rem;border:2px solid var(--border);border-radius:12px;font-size:.95rem;font-family:inherit;background:#faf8f2;transition:.2s;color:var(--text)}
    .form-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(201,70,44,.1);background:#fff}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;width:100%;padding:.9rem 1.5rem;border-radius:12px;font-weight:600;font-size:1rem;border:none;cursor:pointer;transition:.2s;font-family:inherit}
    .btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px)}
    .btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .alert{padding:.85rem 1rem;border-radius:12px;font-size:.88rem;margin-bottom:1.25rem;display:none;font-weight:500}
    .alert-error{background:#fef2f2;color:var(--danger);border:1px solid #fecaca;display:block}
    .alert-success{background:#f0fdf4;color:#0f8b5f;border:1px solid #bbf7d0;display:block}
    .divider{display:flex;align-items:center;gap:1rem;margin:1.5rem 0;color:var(--muted);font-size:.78rem;font-weight:600;opacity:.5}
    .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
    .back-link{display:block;text-align:center;color:var(--muted);font-size:.85rem;text-decoration:underline;transition:.15s}
    .back-link:hover{color:var(--accent)}
    .spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:none}
    .btn-loading .spinner{display:block}.btn-loading .btn-text{display:none}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<div class="wrapper">
  <div class="header"><img src="../assets/images/sfrs.png" alt="SFRS"><div class="badge">&#x1F512; Administrator Access</div><h1>Admin Panel</h1><p>Student Feedback Review System</p></div>
  <div class="card">
    <div class="alert" id="alertBox"></div>
    <div class="form-group"><label class="form-label" for="emailInput">Email or Username</label><input type="text" class="form-input" id="emailInput" placeholder="admin@gmail.com" autocomplete="username" autofocus></div>
    <div class="form-group"><label class="form-label" for="passwordInput">Password</label><input type="password" class="form-input" id="passwordInput" placeholder="Enter your password" autocomplete="current-password"></div>
    <button class="btn btn-primary" id="loginBtn"><span class="btn-text">Sign In</span><span class="spinner"></span></button>
    <div class="divider">or</div>
    <a class="back-link" href="/">Back to SFRS Home</a>
  </div>
</div>
<script src="../assets/js/supabase-client.min.js"></script>
<script>
  var sup = window.supabase.createClient("https://mstotzwqfbcvpcdgrnxy.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1zdG90endxZmJjdnBjZGdybnh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY0ODEzNTAsImV4cCI6MjA4MjA1NzM1MH0.JbIf3inEy0Ks5JPVGQfFycBXenIGDGtqUBjYB1JeAcw");
  var ab = document.getElementById("alertBox"), lb = document.getElementById("loginBtn");
  var ei = document.getElementById("emailInput"), pi = document.getElementById("passwordInput");
  function show(m,t){ab.textContent=m;ab.className="alert";ab.classList.add(t==="error"?"alert-error":"alert-success")}
  function hide(){ab.className="alert";ab.textContent=""}
  function ld(v){if(v){lb.classList.add("btn-loading");lb.disabled=true}else{lb.classList.remove("btn-loading");lb.disabled=false}}

  [ei,pi].forEach(function(el){el.addEventListener("keydown",function(e){if(e.key==="Enter")doLogin()})});
  lb.addEventListener("click",doLogin);

  async function doLogin(){
    hide();
    var login=ei.value.trim(),pw=pi.value;
    if(!login||!pw){show("Please enter both email/username and password.","error");return}
    ld(true);
    try{
      var email=login;
      if(!login.includes("@")){
        var r=await sup.from("profiles").select("email").or("username.eq."+login.toLowerCase()).maybeSingle();
        if(r.data&&r.data.email)email=r.data.email;
      }
      var result=await sup.auth.signInWithPassword({email:email,password:pw});
      if(result.error)throw result.error;
      var profileR=await sup.from("profiles").select("role").eq("id",result.data.user.id).maybeSingle();
      if(!profileR.data||profileR.data.role!=="admin"){await sup.auth.signOut();show("Access denied. Admin account required.","error");return}
      await new Promise(function(r){setTimeout(r,300)});
      window.location.href="../admin-dashboard.html";
    }catch(err){show(err.message||"Login failed.","error")}
    finally{ld(false)}
  }
</script>
</body>
</html>
