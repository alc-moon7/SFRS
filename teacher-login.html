<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teacher Login — SFRS</title>
  <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap");
    :root{--primary:#0c2a42;--accent:#c9462c;--accent-hover:#a53d21;--bg:#f7f4ee;--surface:#fff;--border:#e5dece;--text:#16232c;--muted:#6b6255;--danger:#d92d20;--success:#0f8b5f}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Inter",system-ui,sans-serif;color:var(--text);background:var(--bg);line-height:1.6;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem}
    .wrapper{width:100%;max-width:440px}
    .header{text-align:center;margin-bottom:2rem}.header img{height:44px;width:auto;margin-bottom:.75rem}
    .badge{display:inline-flex;align-items:center;gap:.4rem;background:rgba(16,185,129,.15);color:#059669;font-size:.78rem;font-weight:700;padding:.3rem .9rem;border-radius:100px;margin-bottom:.75rem}
    .header h1{font-size:1.4rem;font-weight:700;color:var(--primary)}.header p{font-size:.88rem;color:var(--muted);margin-top:.25rem}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:2.5rem 2rem;box-shadow:0 20px 50px rgba(12,42,66,.1)}
    .form-group{margin-bottom:1.25rem}.form-label{display:block;font-size:.85rem;font-weight:600;color:var(--text);margin-bottom:.35rem}
    .form-input{width:100%;padding:.85rem 1rem;border:2px solid var(--border);border-radius:12px;font-size:.95rem;font-family:inherit;background:#faf8f2;transition:.2s;color:var(--text)}
    .form-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(201,70,44,.1);background:#fff}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;width:100%;padding:.9rem 1.5rem;border-radius:12px;font-weight:600;font-size:1rem;border:none;cursor:pointer;transition:.2s;font-family:inherit}
    .btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px)}
    .btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .alert{padding:.85rem 1rem;border-radius:12px;font-size:.88rem;margin-bottom:1.25rem;display:none;font-weight:500}
    .alert-error{background:#fef2f2;color:var(--danger);border:1px solid #fecaca;display:block}
    .alert-success{background:#f0fdf4;color:var(--success);border:1px solid #bbf7d0;display:block}
    .link-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;font-size:.85rem}
    .link-row a{color:var(--muted);font-weight:500}.link-row a:hover{color:var(--accent)}
    .footer-link{text-align:center;margin-top:1.5rem;font-size:.85rem;color:var(--muted)}
    .footer-link a{color:var(--primary);font-weight:600}.footer-link a:hover{color:var(--accent)}
    .spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:none}
    .btn-loading .spinner{display:block}.btn-loading .btn-text{display:none}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<div class="wrapper">
  <div class="header"><img src="assets/images/sfrs.png" alt="SFRS"><div class="badge">👨‍🏫 Teacher Portal</div><h1>Teacher Login</h1><p>Access your feedback analytics dashboard</p></div>
  <div class="card">
    <div class="alert" id="alertBox"></div>
    <div class="form-group"><label class="form-label" for="emailInput">Email or Username</label><input type="text" class="form-input" id="emailInput" placeholder="teacher@example.com" autocomplete="username" autofocus></div>
    <div class="form-group"><label class="form-label" for="passwordInput">Password</label><input type="password" class="form-input" id="passwordInput" placeholder="Enter your password" autocomplete="current-password"></div>
    <div class="link-row"><span></span><a href="password-reset.html">Forgot password?</a></div>
    <button class="btn btn-primary" id="loginBtn" onclick="doLogin()"><span class="btn-text">Sign In</span><span class="spinner"></span></button>
  </div>
  <div class="footer-link">New teacher? <a href="teacher-signup.html">Create an account</a></div>
</div>

<script>
  var SUPABASE_URL = "https://mstotzwqfbcvpcdgrnxy.supabase.co";
  var ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1zdG90endxZmJjdnBjZGdybnh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY0ODEzNTAsImV4cCI6MjA4MjA1NzM1MH0.JbIf3inEy0Ks5JPVGQfFycBXenIGDGtqUBjYB1JeAcw";

  var alertBox = document.getElementById("alertBox"), loginBtn = document.getElementById("loginBtn");

  function show(msg, t) { alertBox.textContent = msg; alertBox.className = "alert"; alertBox.classList.add(t === "error" ? "alert-error" : "alert-success"); }
  function hideAlert() { alertBox.className = "alert"; alertBox.textContent = ""; }
  function loading(v) { if (v) { loginBtn.classList.add("btn-loading"); loginBtn.disabled = true; } else { loginBtn.classList.remove("btn-loading"); loginBtn.disabled = false; } }

  async function doLogin() {
    hideAlert();
    var login = document.getElementById("emailInput").value.trim(), pw = document.getElementById("passwordInput").value;
    if (!login || !pw) { show("Please enter both email and password.", "error"); return; }
    loading(true);
    try {
      var email = login;
      if (!login.includes("@")) {
        var r = await fetch(SUPABASE_URL + "/rest/v1/profiles?select=email&or=(username.eq." + encodeURIComponent(login.toLowerCase()) + ")", { headers: { apikey: ANON_KEY, Authorization: "Bearer " + ANON_KEY } });
        var users = await r.json();
        if (users && users.length > 0) email = users[0].email;
      }

      var tr = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", { method: "POST", headers: { "Content-Type": "application/json", apikey: ANON_KEY }, body: JSON.stringify({ email: email, password: pw }) });
      var td = await tr.json();
      if (!td.access_token) { show(td.msg || "Invalid login credentials.", "error"); return; }

      var pr = await fetch(SUPABASE_URL + "/rest/v1/profiles?select=role&id=eq." + td.user.id, { headers: { apikey: ANON_KEY, Authorization: "Bearer " + td.access_token } });
      var profiles = await pr.json();
      if (!profiles || profiles.length === 0 || profiles[0].role !== "teacher") { show("Access denied. Teacher account required.", "error"); return; }

      localStorage.setItem("sb-" + SUPABASE_URL.split("//")[1] + "-auth-token", JSON.stringify({ access_token: td.access_token, refresh_token: td.refresh_token, expires_at: Date.now() + td.expires_in * 1000, user: td.user }));
      show("Login successful! Redirecting...", "success");
      setTimeout(function() { location.href = "teacher-dashboard.html"; }, 800);
    } catch (err) { show("Login failed: " + (err.message || "Network error"), "error"); }
    finally { loading(false); }
  }

  document.getElementById("emailInput").addEventListener("keydown", function(e) { if (e.key === "Enter") doLogin(); });
  document.getElementById("passwordInput").addEventListener("keydown", function(e) { if (e.key === "Enter") doLogin(); });
</script>
</body>
</html>
