<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password Reset — SFRS</title>
  <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap");
    :root{--primary:#0c2a42;--accent:#c9462c;--accent-hover:#a53d21;--bg:#f7f4ee;--surface:#fff;--border:#e5dece;--text:#16232c;--muted:#6b6255;--danger:#d92d20;--success:#0f8b5f}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Inter",system-ui,sans-serif;color:var(--text);background:var(--bg);line-height:1.6;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem}
    .reset-wrapper{width:100%;max-width:440px}
    .reset-header{text-align:center;margin-bottom:2rem}
    .reset-header img{height:44px;width:auto;margin-bottom:.75rem}
    .reset-header .kicker{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:.25rem}
    .reset-header h1{font-size:1.4rem;font-weight:700;color:var(--primary)}
    .reset-header p{font-size:.88rem;color:var(--muted);margin-top:.25rem}
    .reset-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:2.5rem 2rem;box-shadow:0 20px 50px rgba(12,42,66,.1)}
    .form-group{margin-bottom:1.25rem}
    .form-label{display:block;font-size:.85rem;font-weight:600;color:var(--text);margin-bottom:.35rem}
    .form-input{width:100%;padding:.85rem 1rem;border:2px solid var(--border);border-radius:12px;font-size:.95rem;font-family:inherit;background:#faf8f2;transition:.2s;color:var(--text)}
    .form-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(201,70,44,.1);background:#fff}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;width:100%;padding:.9rem 1.5rem;border-radius:12px;font-weight:600;font-size:1rem;border:none;cursor:pointer;transition:.2s;font-family:inherit}
    .btn-primary{background:var(--accent);color:#fff}
    .btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px);box-shadow:0 8px 25px rgba(201,70,44,.3)}
    .btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .alert{padding:.85rem 1rem;border-radius:12px;font-size:.88rem;margin-bottom:1.25rem;display:none;font-weight:500}
    .alert-error{background:#fef2f2;color:var(--danger);border:1px solid #fecaca;display:block}
    .alert-success{background:#f0fdf4;color:var(--success);border:1px solid #bbf7d0;display:block}
    .reset-footer{text-align:center;margin-top:1.5rem;font-size:.85rem;color:var(--muted)}
    .reset-footer a{color:var(--primary);font-weight:600}.reset-footer a:hover{color:var(--accent)}
    .spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:none}
    .btn-loading .spinner{display:block}.btn-loading .btn-text{display:none}
    .hidden{display:none!important}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<div class="reset-wrapper">
  <div class="reset-header">
    <img src="assets/images/sfrs.png" alt="SFRS">
    <div class="kicker">Account Recovery</div>
    <h1>Reset Password</h1>
    <p>Restore access to your SFRS workspace</p>
  </div>

  <div class="reset-card">
    <div id="requestSection">
      <div class="alert" id="requestAlert"></div>
      <form id="requestForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="resetEmail">Email Address</label>
          <input type="email" class="form-input" id="resetEmail" placeholder="your@email.com" autocomplete="email" autofocus required>
        </div>
        <button type="submit" class="btn btn-primary" id="requestBtn">
          <span class="btn-text">Send Reset Link</span><span class="spinner"></span>
        </button>
      </form>
    </div>

    <div id="updateSection" class="hidden">
      <div class="alert" id="updateAlert"></div>
      <form id="updateForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="newPassword">New Password</label>
          <input type="password" class="form-input" id="newPassword" placeholder="Min 6 characters" autocomplete="new-password" minlength="6" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm New Password</label>
          <input type="password" class="form-input" id="confirmPassword" placeholder="Re-enter password" autocomplete="new-password" minlength="6" required>
        </div>
        <button type="submit" class="btn btn-primary" id="updateBtn">
          <span class="btn-text">Update Password</span><span class="spinner"></span>
        </button>
      </form>
    </div>
  </div>

  <div class="reset-footer"><a href="/">← Back to SFRS Home</a></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const sup=window.supabase.createClient("https://mstotzwqfbcvpcdgrnxy.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1zdG90endxZmJjdnBjZGdybnh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY0ODEzNTAsImV4cCI6MjA4MjA1NzM1MH0.JbIf3inEy0Ks5JPVGQfFycBXenIGDGtqUBjYB1JeAcw");
  const rs=document.getElementById("requestSection"),us=document.getElementById("updateSection");
  const ra=document.getElementById("requestAlert"),ua=document.getElementById("updateAlert");
  const rb=document.getElementById("requestBtn"),ub=document.getElementById("updateBtn");
  function show(el,msg,t){el.textContent=msg;el.className="alert";el.classList.add(t==="error"?"alert-error":"alert-success")}
  function hide(el){el.className="alert";el.textContent=""}
  function ld(btn,v){if(v){btn.classList.add("btn-loading");btn.disabled=true}else{btn.classList.remove("btn-loading");btn.disabled=false}}
  function setUpdate(){rs.classList.add("hidden");us.classList.remove("hidden")}

  // ── INIT: Only show update form if there's a recovery token in the URL ──
  (async function init(){
    const qp=new URLSearchParams(location.search);
    const th=qp.get("token_hash"),ty=qp.get("type");
    const hasHashToken=location.hash&&location.hash.includes("type=");
    const isRecoveryVisit=!!(th||hasHashToken);

    // If no token at all, stay on request form (even if logged in from before)
    if(!isRecoveryVisit)return;

    // There IS a token — verify it and show update form
    setUpdate();

    // Method 1: token_hash in query params (from email template links)
    if(th&&ty){
      try{
        const{data,error}=await sup.auth.verifyOtp({token_hash:th,type:ty});
        if(!error&&data?.session){show(ua,"Session verified — set your new password.","success");return}
        if(error){show(ua,error.message||"Invalid or expired link.","error");return}
      }catch(e){show(ua,"Invalid or expired link.","error");return}
    }

    // Method 2: Hash fragments — Supabase JS will auto-process, wait and check
    if(hasHashToken){
      // Supabase JS needs a tick to process hash tokens
      await new Promise(r=>setTimeout(r,800));
      const{s}=await sup.auth.getSession();
      if(s){show(ua,"Session verified — set your new password.","success");return}
      // Still no session after waiting — maybe processing failed
      show(ua,"Could not verify your session. Please request a new reset link.","error");
    }
  })();

  // ── Request reset via email ──
  document.getElementById("requestForm").addEventListener("submit",async e=>{
    e.preventDefault();hide(ra);
    const email=document.getElementById("resetEmail").value.trim();
    if(!email){show(ra,"Please enter your email.","error");return}
    ld(rb,true);
    try{
      const{error}=await sup.auth.resetPasswordForEmail(email,{redirectTo:location.origin+"/password-reset.html"});
      if(error)throw error;
      show(ra,"Reset link sent! Check your email inbox.","success");
    }catch(err){show(ra,err.message||"Failed to send link.","error")}
    finally{ld(rb,false)}
  });

  // ── Update password ──
  document.getElementById("updateForm").addEventListener("submit",async e=>{
    e.preventDefault();hide(ua);
    const pw=document.getElementById("newPassword").value,cp=document.getElementById("confirmPassword").value;
    if(!pw||pw.length<6){show(ua,"Password must be at least 6 characters.","error");return}
    if(pw!==cp){show(ua,"Passwords do not match.","error");return}
    ld(ub,true);
    try{
      const{error}=await sup.auth.updateUser({password:pw});
      if(error)throw error;
      show(ua,"Password updated! Redirecting...","success");
      setTimeout(()=>location.href="/",1200);
    }catch(err){show(ua,err.message||"Update failed. Request a new reset link.","error")}
    finally{ld(ub,false)}
  });
</script>
</body>
</html>
