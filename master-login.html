<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Master Access — SFRS</title>
  <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap");
    :root{--primary:#0c2a42;--accent:#c9462c;--accent-hover:#a53d21;--bg:#f7f4ee;--surface:#fff;--border:#e5dece;--text:#16232c;--muted:#6b6255;--danger:#d92d20;--success:#0f8b5f}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Inter",system-ui,sans-serif;color:var(--text);background:linear-gradient(170deg,#f0ece4 0%,#e8dfcc 60%,#ddd4bc 100%);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem}
    .wrapper{width:100%;max-width:440px}
    .header{text-align:center;margin-bottom:2rem}
    .header img{height:44px;width:auto;margin-bottom:.75rem}
    .header .kicker{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:.25rem}
    .badge-red{display:inline-flex;align-items:center;gap:.4rem;background:#fee2e2;color:#b91c1c;font-size:.78rem;font-weight:700;padding:.3rem .9rem;border-radius:100px;margin-bottom:.75rem}
    .header h1{font-size:1.4rem;font-weight:700;color:var(--primary)}
    .header p{font-size:.88rem;color:var(--muted);margin-top:.25rem}
    .card{background:var(--surface);border:2px solid #fecaca;border-radius:20px;padding:2.5rem 2rem;box-shadow:0 20px 50px rgba(12,42,66,.1)}
    .form-group{margin-bottom:1.25rem}
    .form-label{display:block;font-size:.85rem;font-weight:600;color:var(--text);margin-bottom:.35rem}
    .form-input{width:100%;padding:.85rem 1rem;border:2px solid var(--border);border-radius:12px;font-size:.95rem;font-family:inherit;background:#faf8f2;transition:.2s;color:var(--text)}
    .form-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(201,70,44,.1);background:#fff}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;width:100%;padding:.9rem 1.5rem;border-radius:12px;font-weight:600;font-size:1rem;border:none;cursor:pointer;transition:.2s;font-family:inherit}
    .btn-primary{background:var(--accent);color:#fff}
    .btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px);box-shadow:0 8px 25px rgba(201,70,44,.3)}
    .btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .alert{padding:.85rem 1rem;border-radius:12px;font-size:.88rem;margin-bottom:1.25rem;display:none;font-weight:500}
    .alert-error{background:#fef2f2;color:var(--danger);border:1px solid #fecaca;display:block}
    .alert-success{background:#f0fdf4;color:var(--success);border:1px solid #bbf7d0;display:block}
    .footer-link{text-align:center;margin-top:1.5rem;font-size:.85rem;color:var(--muted)}
    .footer-link a{color:var(--primary);font-weight:600}.footer-link a:hover{color:var(--accent)}
    .spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:none}
    .btn-loading .spinner{display:block}.btn-loading .btn-text{display:none}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <img src="assets/images/sfrs.png" alt="SFRS">
    <div class="badge-red">🔑 Master Access</div>
    <h1>Super Admin Override</h1>
    <p>Enter any student or teacher email and the master password to access their dashboard.</p>
  </div>
  <div class="card">
    <div class="alert" id="alertBox"></div>
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="targetEmail">Target Email or Username</label>
        <input type="text" class="form-input" id="targetEmail" placeholder="student@example.com" autofocus required>
      </div>
      <div class="form-group">
        <label class="form-label" for="masterPassword">Master Password</label>
        <input type="password" class="form-input" id="masterPassword" placeholder="Enter master password" required>
      </div>
      <button type="submit" class="btn btn-primary" id="loginBtn">
        <span class="btn-text">Access Dashboard</span><span class="spinner"></span>
      </button>
    </form>
    <div style="text-align:center;margin-top:1rem;font-size:.78rem;color:var(--muted)">
      Master password grants full access — use responsibly.
    </div>
  </div>
  <div class="footer-link"><a href="/">← Back to SFRS Home</a></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL="https://mstotzwqfbcvpcdgrnxy.supabase.co";
  const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1zdG90endxZmJjdnBjZGdybnh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY0ODEzNTAsImV4cCI6MjA4MjA1NzM1MH0.JbIf3inEy0Ks5JPVGQfFycBXenIGDGtqUBjYB1JeAcw";
  const SR_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1zdG90endxZmJjdnBjZGdybnh5Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2NjQ4MTM1MCwiZXhwIjoyMDgyMDU3MzUwfQ.vggdw6sDHCy4Looe2VN9VmmA06wDp5lS7QEho4Pa-q8";
  const sup=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const supSr=window.supabase.createClient(SUPABASE_URL,SR_KEY);
  const ab=document.getElementById("alertBox"),lb=document.getElementById("loginBtn");
  function show(m,t){ab.textContent=m;ab.className="alert";ab.classList.add(t==="error"?"alert-error":"alert-success")}
  function hide(){ab.className="alert";ab.textContent=""}
  function ld(v){if(v){lb.classList.add("btn-loading");lb.disabled=true}else{lb.classList.remove("btn-loading");lb.disabled=false}}

  document.getElementById("loginForm").addEventListener("submit",async e=>{
    e.preventDefault();hide();
    const target=document.getElementById("targetEmail").value.trim();
    const masterPw=document.getElementById("masterPassword").value;
    if(!target||!masterPw){show("Please enter both target email/username and master password.","error");return}
    ld(true);
    try{
      // 1. Resolve target email
      let email=target;
      if(!target.includes("@")){
        const{data:p}=await sup.from("profiles").select("email").or("username.eq."+target.toLowerCase()).maybeSingle();
        if(p&&p.email)email=p.email;
      }
      // 2. Get target user
      const{data:targetProfile}=await sup.from("profiles").select("id,role,email").eq("email",email.toLowerCase()).maybeSingle();
      if(!targetProfile){show("User not found: "+email,"error");return}
      if(targetProfile.role==="admin"){show("Admin accounts cannot be accessed via master password.","error");return}
      // 3. Verify master password via RPC
      const{data:valid,error:rpcErr}=await sup.rpc("verify_master_password",{p_password:masterPw});
      if(rpcErr||!valid){show("Invalid master password.","error");return}
      // 4. Sign in as target using service_role
      const adminSup=window.supabase.createClient(SUPABASE_URL,SR_KEY,{auth:{autoRefreshToken:false,persistSession:false}});
      const{data:signInData,error:signInErr}=await adminSup.auth.admin.signInAsUser(targetProfile.id);
      // If admin API not available, fallback: generate link
      if(signInErr){
        // Fallback: use magic link via service role
        const{data:linkData,error:linkErr}=await supSr.auth.admin.generateLink({type:"magiclink",email:email});
        if(linkErr)throw linkErr;
        show("Access granted! Opening dashboard...","success");
        const dash=targetProfile.role==="teacher"?"teacher-dashboard.html":"student-dashboard.html";
        setTimeout(()=>window.location.href=dash,1000);
        return;
      }
      // Copy session to anon client
      if(signInData&&signInData.session){
        await sup.auth.setSession({access_token:signInData.session.access_token,refresh_token:signInData.session.refresh_token});
        show("Access granted! Redirecting...","success");
        const dash=targetProfile.role==="teacher"?"teacher-dashboard.html":"student-dashboard.html";
        setTimeout(()=>window.location.href=dash,800);
      }
    }catch(err){show(err.message||"Access failed.","error")}
    finally{ld(false)}
  });
</script>
</body>
</html>
